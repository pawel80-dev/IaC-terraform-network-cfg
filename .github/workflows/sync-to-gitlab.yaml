name: Sync to GitLab

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Remove existing gitlab remote
        run: git remote remove gitlab 2>/dev/null || true

        # LAB environment with a self-signed certificate
      - name: Disable Git SSL verification
        run: git config --global http.sslVerify false

      - name: Sync to GitLab
        uses: kujov/gitlab-sync@main
        with:
          gitlab_url: ${{ secrets.GITLAB_URL }}
          username: ${{ secrets.USERNAME }}
          gitlab_pat: ${{ secrets.GITLAB_PAT }}
